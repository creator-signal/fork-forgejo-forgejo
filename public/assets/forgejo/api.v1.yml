components:
  # ── Parameters ─────────────────────────────────────────────────
  parameters:
    owner:
      name: owner
      in: path
      required: true
      schema:
        type: string
      description: owner of the repo
    repo:
      name: repo
      in: path
      required: true
      schema:
        type: string
      description: name of the repo
    org:
      name: org
      in: path
      required: true
      schema:
        type: string
      description: name of the organization
    projectId:
      name: project
      in: path
      required: true
      schema:
        type: integer
        format: int64
      description: ID of the project
    column:
      name: column
      in: path
      required: true
      schema:
        type: integer
        format: int64
      description: ID of the project column
    card:
      name: card
      in: path
      required: true
      schema:
        type: integer
        format: int64
      description: ID of the project card
    page:
      name: page
      in: query
      schema:
        type: integer
        default: 1
        minimum: 1
      description: page number of results to return (1-based)
    limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 0
      description: page size of results
    state:
      name: state
      in: query
      schema:
        type: string
        enum: [open, closed, all]
        default: open
      description: filter by project state
    keyword:
      name: keyword
      in: query
      schema:
        type: string
      description: search projects by title keyword
    sort:
      name: sort
      in: query
      schema:
        type: string
        enum: [oldest, newest, alphabetically, reversealphabetically, recentupdate, leastupdate]
      description: sort order

  # ── Schemas ────────────────────────────────────────────────────
  schemas:
    Version:
      type: object
      properties:
        version:
          type: string

    APIError:
      type: object
      properties:
        message:
          type: string
        url:
          type: string

    Project:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        body:
          type: string
        state:
          type: string
          enum: [open, closed]
        template_type:
          type: integer
          description: "0=none, 1=basic kanban, 2=bug triage"
        card_type:
          type: integer
          description: "0=text only, 1=images and text"
        type:
          type: integer
          description: "1=individual, 2=repository, 3=organization"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        closed_at:
          type: string
          format: date-time
          nullable: true
        column_count:
          type: integer
        open_issues:
          type: integer
        closed_issues:
          type: integer

    ProjectColumn:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        color:
          type: string
        default:
          type: boolean
        sorting:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        card_count:
          type: integer

    ProjectCard:
      type: object
      properties:
        id:
          type: integer
          format: int64
        sorting:
          type: integer
          format: int64
        issue:
          $ref: '#/components/schemas/ProjectCardIssue'
        column:
          $ref: '#/components/schemas/ProjectColumn'

    ProjectCardIssue:
      type: object
      description: Minimal issue info embedded in a project card
      properties:
        id:
          type: integer
          format: int64
        number:
          type: integer
          format: int64
        title:
          type: string
        state:
          type: string
        is_pull:
          type: boolean

    CreateProjectOption:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        body:
          type: string
        template_type:
          type: integer
          description: "0=none, 1=basic kanban, 2=bug triage"
          default: 0

    EditProjectOption:
      type: object
      properties:
        title:
          type: string
          maxLength: 255
        body:
          type: string
        state:
          type: string
          enum: [open, closed]
        card_type:
          type: integer
          description: "0=text only, 1=images and text"

    CreateColumnOption:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          minLength: 1
        color:
          type: string
          pattern: '^#[0-9a-fA-F]{6}$'

    EditColumnOption:
      type: object
      properties:
        title:
          type: string
        color:
          type: string
          pattern: '^#[0-9a-fA-F]{6}$'

    ColumnPosition:
      type: object
      required:
        - column_id
        - position
      properties:
        column_id:
          type: integer
          format: int64
        position:
          type: integer
          minimum: 0

    MoveColumnsOption:
      type: object
      required:
        - columns
      properties:
        columns:
          type: array
          items:
            $ref: '#/components/schemas/ColumnPosition'
          minItems: 1

    AddCardOption:
      type: object
      required:
        - issue_id
      properties:
        issue_id:
          type: integer
          format: int64
        position:
          type: integer
          format: int64

    MoveCardOption:
      type: object
      properties:
        column_id:
          type: integer
          format: int64
        position:
          type: integer
          format: int64

    CardPosition:
      type: object
      required:
        - card_id
        - position
      properties:
        card_id:
          type: integer
          format: int64
        position:
          type: integer
          format: int64
          minimum: 0

    ReorderCardsOption:
      type: object
      required:
        - card_positions
      properties:
        card_positions:
          type: array
          items:
            $ref: '#/components/schemas/CardPosition'
          minItems: 1

  # ── Responses ──────────────────────────────────────────────────
  responses:
    Project:
      description: a project
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Project'
    ProjectList:
      description: list of projects
      headers:
        X-Total-Count:
          schema:
            type: integer
          description: total number of projects
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Project'
    ProjectColumn:
      description: a project column
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProjectColumn'
    ProjectColumnList:
      description: list of project columns
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/ProjectColumn'
    ProjectCard:
      description: a project card
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProjectCard'
    ProjectCardList:
      description: list of project cards
      headers:
        X-Total-Count:
          schema:
            type: integer
          description: total number of cards
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/ProjectCard'
    NotFound:
