openapi: 3.0.0
info:
  title: Forgejo API
  description: |-
    Forgejo REST API

  contact:
    email: contact@forgejo.org
  license:
    name: MIT
    url: https://codeberg.org/forgejo/forgejo/src/branch/forgejo/LICENSE
  version: 1.0.0
externalDocs:
  description: Find out more about Forgejo
  url: http://forgejo.org
servers:
  - url: /api/forgejo/v1
paths:
  /version:
    get:
      summary: API version
      description: Semantic version of the Forgejo API
      operationId: getVersion
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Version'

  # ── Repo Projects ──────────────────────────────────────────────
  /repos/{owner}/{repo}/projects:
    get:
      tags: [project]
      summary: List repository projects
      operationId: listRepoProjects
      parameters:
        - $ref: '#/components/parameters/owner'
        - $ref: '#/components/parameters/repo'
        - $ref: '#/components/parameters/state'
        - $ref: '#/components/parameters/keyword'
        - $ref: '#/components/parameters/sort'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          $ref: '#/components/responses/ProjectList'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [project]
      summary: Create a repository project
      operationId: createRepoProject
      parameters:
        - $ref: '#/components/parameters/owner'
        - $ref: '#/components/parameters/repo'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectOption'
      responses:
        '201':
          $ref: '#/components/responses/Project'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /repos/{owner}/{repo}/projects/{project}:
    get:
      tags: [project]
      summary: Get a repository project
      operationId: getRepoProject
      parameters:
        - $ref: '#/components/parameters/owner'
        - $ref: '#/components/parameters/repo'
        - $ref: '#/components/parameters/projectId'
      responses:
        '200':
          $ref: '#/components/responses/Project'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [project]
      summary: Update a repository project
      operationId: updateRepoProject
      parameters:
        - $ref: '#/components/parameters/owner'
        - $ref: '#/components/parameters/repo'
        - $ref: '#/components/parameters/projectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditProjectOption'
      responses:
        '200':
          $ref: '#/components/responses/Project'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [project]
      summary: Delete a repository project
      operationId: deleteRepoProject
      parameters:
        - $ref: '#/components/parameters/owner'
        - $ref: '#/components/parameters/repo'
        - $ref: '#/components/parameters/projectId'
      responses:
        '204':
          description: project deleted
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /repos/{owner}/{repo}/projects/{project}/columns:
    get:
      tags: [project]
      summary: List project columns
      operationId: listRepoProjectColumns
      parameters:
        - $ref: '#/components/parameters/owner'
        - $ref: '#/components/parameters/repo'
        - $ref: '#/components/parameters/projectId'
