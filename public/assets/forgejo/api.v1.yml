  /orgs/{org}/projects/{project}/columns/move:
    post:
      tags: [project]
      summary: Reorder organization project columns
      operationId: moveOrgProjectColumns
      parameters:
        - $ref: '#/components/parameters/org'
        - $ref: '#/components/parameters/projectId'
      requestBody:
