  /repos/{owner}/{repo}/projects/{project}/cards/{card}:
    patch:
      tags: [project]
      summary: Move a project card
      operationId: moveRepoProjectCard
      parameters:
        - $ref: '#/components/parameters/owner'
        - $ref: '#/components/parameters/repo'
        - $ref: '#/components/parameters/projectId'
        - $ref: '#/components/parameters/card'
      requestBody:
