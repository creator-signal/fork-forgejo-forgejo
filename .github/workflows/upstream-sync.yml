name: Governed Forgejo upstream synchronization

on:
  schedule:
    - cron: '43 4 * * *'
  workflow_dispatch:
    inputs:
      mode:
        required: true
        type: choice
        default: dry-run
        options: [dry-run, apply]

permissions:
  contents: read

concurrency:
  group: forgejo-upstream-sync
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Plan non-destructive synchronization
        run: python3 scripts/creator-signal/release_control.py sync --mode dry-run --repository "$GITHUB_REPOSITORY" --report upstream-sync-dry-run.json
      - if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: forgejo-upstream-sync-dry-run-${{ github.run_id }}
          path: upstream-sync-dry-run.json
          if-no-files-found: warn
          retention-days: 14

  apply:
    needs: plan
    if: ${{ github.event_name == 'schedule' || inputs.mode == 'apply' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Apply non-destructive synchronization
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cleanup() { git config --local --unset-all credential.helper || true; }
          trap cleanup EXIT
          # Expand GH_TOKEN only when Git invokes the configured helper.
          # shellcheck disable=SC2016
          git config --local credential.helper '!f() { test "$1" = get && echo "username=x-access-token" && echo "password=$GH_TOKEN"; }; f'
          python3 scripts/creator-signal/release_control.py sync --mode apply --repository "$GITHUB_REPOSITORY" --report upstream-sync-apply.json
      - if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: forgejo-upstream-sync-apply-${{ github.run_id }}
          path: upstream-sync-apply.json
          if-no-files-found: warn
          retention-days: 14
