name: Forgejo automation validation

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forgejo-automation-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Deterministic release and mirror contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out automation change
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run release-control tests
        run: python3 -m unittest scripts/creator-signal/test_release_control.py scripts/creator-signal/test_qualify_secret_pair.py
      - name: Enforce workflow and supply-chain contracts
        run: python3 scripts/creator-signal/check_workflow_contract.py
      - name: Exercise live upstream synchronization dry-run
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/creator-signal/release_control.py sync --mode dry-run --repository "$GITHUB_REPOSITORY" --report upstream-sync-ci.json
      - name: Install checksum-pinned actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location --output "$archive" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir actionlint-bin
          tar -xzf "$archive" -C actionlint-bin actionlint
      - name: Lint GitHub workflows
        run: actionlint-bin/actionlint -color
      - name: Preserve mirror dry-run
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: forgejo-upstream-sync-ci-${{ github.run_id }}
          path: upstream-sync-ci.json
          if-no-files-found: warn
          retention-days: 14

  security:
    name: GitHub Actions security analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Audit workflows with pinned zizmor
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          inputs: .github/workflows
          version: 1.29.0
          persona: pedantic
          min-severity: medium
          min-confidence: high
          online-audits: false
          advanced-security: false
          annotations: false

  downstream-release-qualification:
    name: Downstream v16.0.3-cs.2 native qualification
    needs: [contracts, security]
    uses: ./.github/workflows/forgejo-qualification.yml
    with:
      source_ref: ea24b68caa7ae6ade4bd7d51a983f8e7b60c1aa6
      release_tag: v16.0.3-cs.2
      release_version: 16.0.3-cs.2
      base_source_sha: eccddb2d17c93b42b2c8995725e03e549ac9ec0c
      source_patch_sha256: 2fe7728f4ddc813aed5e0f1f68e152c276cc77ee063be6cfc93d8cd06cc1f987
    permissions:
      contents: read
