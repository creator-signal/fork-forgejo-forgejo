name: Reusable Forgejo variant publication

on:
  workflow_call:
    inputs:
      source_ref: {required: true, type: string}
      source_sha: {required: true, type: string}
      version: {required: true, type: string}
      variant: {required: true, type: string}
      dockerfile: {required: true, type: string}
    outputs:
      digest:
        value: ${{ jobs.publish.outputs.digest }}

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - name: Verify exact committed downstream source checkout
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          DOCKERFILE: ${{ inputs.dockerfile }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(grep -Fc '@sha256:' "$DOCKERFILE")" -eq 3
          test "$(grep -Fxc 'RUN apk upgrade --no-cache' "$DOCKERFILE")" -eq 1
          git diff --exit-code
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build immutable multi-architecture candidate
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          build-args: |
            RELEASE_VERSION=${{ inputs.version }}
            GOPROXY=https://proxy.golang.org|direct
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ inputs.source_sha }}
            org.opencontainers.image.version=${{ inputs.version }}
          tags: ghcr.io/creator-signal/forgejo:candidate-${{ inputs.version }}-${{ github.run_id }}-${{ inputs.variant }}
          cache-from: type=gha,scope=forgejo-publish-${{ inputs.variant }}
          cache-to: type=gha,mode=min,scope=forgejo-publish-${{ inputs.variant }}
      - name: Preserve exact manifest structure
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          VARIANT: ${{ inputs.variant }}
        run: docker buildx imagetools inspect --raw "ghcr.io/creator-signal/forgejo@${DIGEST}" > "manifest-${VARIANT}.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: forgejo-published-${{ inputs.variant }}-${{ github.run_id }}
          path: |
            manifest-${{ inputs.variant }}.json
          if-no-files-found: error
          retention-days: 14
