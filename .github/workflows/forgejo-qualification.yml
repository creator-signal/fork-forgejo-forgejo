name: Reusable Forgejo container qualification

on:
  workflow_call:
    inputs:
      source_ref:
        required: true
        type: string
      release_tag:
        required: true
        type: string
      release_version:
        required: true
        type: string
      base_source_sha:
        required: true
        type: string
      source_patch_sha256:
        required: true
        type: string

permissions:
  contents: read

jobs:
  qualify:
    name: ${{ matrix.variant }} ${{ matrix.platform }} native build, smoke, scan, SBOM
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: rootful
            dockerfile: Dockerfile
            platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - variant: rootless
            dockerfile: Dockerfile.rootless
            platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - variant: rootful
            dockerfile: Dockerfile
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
          - variant: rootless
            dockerfile: Dockerfile.rootless
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Check out exact committed downstream source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 33
          persist-credentials: false
          path: runtime-source
      - name: Check out exact qualification controller separately from image context
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          path: qualification-control
      - name: Verify exact source and committed patch identity
        working-directory: runtime-source
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          BASE_SOURCE_SHA: ${{ inputs.base_source_sha }}
          PATCH_SHA256: ${{ inputs.source_patch_sha256 }}
          DOCKERFILE: ${{ matrix.dockerfile }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_REF"
          if [ "$RELEASE_TAG" = v16.0.3-cs.2 ]; then
            python3 ../qualification-control/scripts/creator-signal/release_control.py verify-source-checkout \
              --tag "$RELEASE_TAG" --source-sha "$SOURCE_REF" \
              --base-source-sha "$BASE_SOURCE_SHA" --patch-sha256 "$PATCH_SHA256"
          else
            test "$(git rev-parse HEAD^)" = "$BASE_SOURCE_SHA"
          fi
          test -n "$PATCH_SHA256"
          git diff --no-ext-diff --binary --abbrev=9 "$BASE_SOURCE_SHA" "$SOURCE_REF" -- > ../creator-signal-source.patch
          echo "${PATCH_SHA256}  ../creator-signal-source.patch" | sha256sum --check --strict
          test "$(grep -Fc '@sha256:' "$DOCKERFILE")" -eq 3
          test "$(grep -Fxc 'RUN apk upgrade --no-cache' "$DOCKERFILE")" -eq 1
          git diff --exit-code
          test -z "$(git tag --list "$RELEASE_TAG")"
          git tag "$RELEASE_TAG" "$SOURCE_REF"
          test "$(git describe --tags --exact-match HEAD)" = "$RELEASE_TAG"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build native candidate without publication
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: runtime-source
          file: runtime-source/${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          provenance: false
          sbom: false
          build-args: |
            RELEASE_VERSION=${{ inputs.release_version }}
            GOPROXY=https://proxy.golang.org|direct
          labels: |
            org.opencontainers.image.revision=${{ inputs.source_ref }}
            org.opencontainers.image.version=${{ inputs.release_version }}
          tags: creator-signal-forgejo-qualification:${{ matrix.variant }}-${{ matrix.arch }}
          cache-from: type=gha,scope=forgejo-${{ matrix.variant }}-${{ matrix.arch }}
          cache-to: type=gha,mode=min,scope=forgejo-${{ matrix.variant }}-${{ matrix.arch }}
      - name: Build the same pinned native compiler stage for atomic runtime tests
        if: ${{ inputs.release_tag == 'v16.0.3-cs.2' }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: runtime-source
          file: runtime-source/${{ matrix.dockerfile }}
          target: build-env
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          provenance: false
          sbom: false
          build-args: |
            RELEASE_VERSION=${{ inputs.release_version }}
            GOPROXY=https://proxy.golang.org|direct
          tags: creator-signal-forgejo-test:${{ matrix.variant }}-${{ matrix.arch }}-${{ github.run_id }}
      - name: Capture bounded grpc dependency graph without qualification
        if: ${{ inputs.release_tag == 'v16.0.3-cs.2' }}
        timeout-minutes: 25
        env:
          TEST_IMAGE: creator-signal-forgejo-test:${{ matrix.variant }}-${{ matrix.arch }}-${{ github.run_id }}
          TEST_CONTAINER: cs-pair-compiler-${{ matrix.variant }}-${{ matrix.arch }}-${{ github.run_id }}
          VARIANT: ${{ matrix.variant }}
          ARCH: ${{ matrix.arch }}
          SOURCE_SHA: ${{ inputs.source_ref }}
          CONTROLLER_SHA: ${{ github.workflow_sha }}
        run: |
          test "$SOURCE_SHA" = 2d1f5bea847d1c9d2336e1f22e5b90ada5f8ada9
          test "$(git -C runtime-source rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git -C qualification-control rev-parse HEAD)" = "$CONTROLLER_SHA"
          git -C runtime-source diff --exit-code
          image_id="$(docker image inspect "$TEST_IMAGE" --format '{{.Id}}')"
          image_entrypoint="$(docker image inspect "$TEST_IMAGE" --format '{{json .Config.Entrypoint}}')"
          echo 'compilerNativeObservation=ImageIdentityRead'
          docker image inspect "$TEST_IMAGE" | jq -e 'length == 1 and (.[0].Config.Volumes == null or .[0].Config.Volumes == {})' >/dev/null
          echo 'compilerNativeObservation=ImageVolumesEmpty'
          # Reserve the unprivileged test identity only inside the admitted compiler.
          compiler_script="$(cat <<'COMPILER'
          test "$(id -u)" = 0
          test "$PWD" = /go/src/forgejo.org
          test ! -e /tmp/creator-signal-compiler-home
          test ! -L /tmp/creator-signal-compiler-home
          addgroup -S -g 1000 forgejo
          adduser -D -u 1000 -G forgejo -h /tmp/creator-signal-compiler-home -s /bin/sh forgejo
          test "$(id -u forgejo)" = 1000
          test "$(id -g forgejo)" = 1000
          chmod 700 /tmp/creator-signal-compiler-home
          chown -R 1000:1000 /go/src/forgejo.org
          exec su -s /bin/sh forgejo -c '
          set -eu
          test "$(id -u)" = 1000
          test "$(id -g)" = 1000
          export HOME=/tmp/creator-signal-compiler-home TZ=UTC GITEA_ROOT="$PWD"
          export GOPATH="$HOME/go" GOMODCACHE="$HOME/go/pkg/mod" GOCACHE="$HOME/.cache/go-build"
          export GOPROXY=https://proxy.golang.org GOSUMDB=sum.golang.org GOTOOLCHAIN=local
          unset GOPRIVATE GONOPROXY GONOSUMDB GOFLAGS
          umask 077
          mkdir "$HOME/dependency-capture"
          go get google.golang.org/grpc@v1.83.2
          go mod tidy
          for name in go.mod go.sum; do
            test -f "$name" && test ! -L "$name"
            test "$(stat -c %h "$name")" = 1
            test "$(wc -c < "$name")" -gt 0
            test "$(wc -c < "$name")" -le 1048576
            cp "$name" "$HOME/dependency-capture/$name"
            chmod 400 "$HOME/dependency-capture/$name"
          done
          (cd "$HOME/dependency-capture" && sha256sum go.mod go.sum > SHA256SUMS)
          chmod 400 "$HOME/dependency-capture/SHA256SUMS"
          if test -f "$HOME/dependency-capture/go.mod"; then exit 0; fi
          make swagger-check
          make swagger-validate
          go test -count=1 -tags "sqlite sqlite_unlock_notify" ./models/secret ./services/secrets ./services/actions
          make generate-ini-sqlite
          GITEA_CONF=tests/sqlite.ini go test -count=1 -tags "sqlite sqlite_unlock_notify" ./models/forgejo_migrations -run ActionSecretPair
          make "test-sqlite#SecretPair"'
          COMPILER
          )"
          container_id=""
          custody_admitted=false
          custody() {
            docker inspect "$TEST_CONTAINER" | jq -e --arg id "$container_id" --arg image "$image_id" --arg name "/$TEST_CONTAINER" --arg script "$compiler_script" --argjson entrypoint "$image_entrypoint" '
              if length != 1 then false else (.[0] | {
                identity: (.Id == $id and .Image == $image and .Name == $name),
                purpose: (.Config.Labels["creator-signal.purpose"] == "creator-signal-fork-secret-pair-compiler"),
                entrypoint: (.Config.Entrypoint == $entrypoint),
                command: (.Config.Cmd == ["timeout","-k","5","1200","sh","-ec",$script]),
                emptyMounts: (.Mounts == []),
                unprivileged: (.HostConfig.Privileged == false),
                defaultNetwork: (.HostConfig.NetworkMode == "bridge"),
                noBinds: (((.HostConfig.Binds // []) | length) == 0),
                noVolumesFrom: (((.HostConfig.VolumesFrom // []) | length) == 0),
                noDevices: (((.HostConfig.Devices // []) | length) == 0),
                noDeviceRequests: (((.HostConfig.DeviceRequests // []) | length) == 0),
                noAddedCapabilities: (((.HostConfig.CapAdd // []) | length) == 0),
                noPublishedPorts: (((.HostConfig.PortBindings // {}) | length) == 0),
                noSecurityOverrides: (((.HostConfig.SecurityOpt // []) | length) == 0),
                privatePid: (.HostConfig.PidMode == ""),
                privateUts: (.HostConfig.UTSMode == ""),
                privateIpc: (.HostConfig.IpcMode == "private")
              }) | . as $checks | {compilerCustodyChecks:$checks}, (all($checks[]; . == true)) end'
          }
          cleanup() {
            if [ -n "$container_id" ]; then
              test "$custody_admitted" = true || return 1
              custody || return 1
              docker rm --force --volumes "$TEST_CONTAINER" >/dev/null
            fi
          }
          trap cleanup EXIT
          container_id="$(docker create --name "$TEST_CONTAINER" --network bridge \
            --label creator-signal.purpose=creator-signal-fork-secret-pair-compiler \
            "$image_id" timeout -k 5 1200 sh -ec "$compiler_script")"
          echo 'compilerNativeObservation=ContainerCreated'
          custody
          custody_admitted=true
          echo 'compilerNativeObservation=ContainerCustodyObserved'
          docker start "$TEST_CONTAINER" >/dev/null
          result="$(docker wait "$TEST_CONTAINER")"
          docker logs "$TEST_CONTAINER" 2>&1 | head -c 1048577 > "secret-pair-tests-${VARIANT}-${ARCH}.log"
          test "$(wc -c < "secret-pair-tests-${VARIANT}-${ARCH}.log")" -le 1048576
          test "$result" = 0
          test "$(docker inspect "$TEST_CONTAINER" --format '{{.State.Running}}')" = false
          test "$(docker inspect "$TEST_CONTAINER" --format '{{.State.ExitCode}}')" = 0
          custody
          capture_dir="dependency-capture-${VARIANT}-${ARCH}"
          test ! -e "$capture_dir" && test ! -L "$capture_dir"
          mkdir -m 700 "$capture_dir"
          for name in go.mod go.sum SHA256SUMS; do
            docker cp "$container_id:/tmp/creator-signal-compiler-home/dependency-capture/$name" "$capture_dir/$name"
            test -f "$capture_dir/$name" && test ! -L "$capture_dir/$name"
            test "$(stat -c %h "$capture_dir/$name")" = 1
            test "$(wc -c < "$capture_dir/$name")" -gt 0
            test "$(wc -c < "$capture_dir/$name")" -le 1048576
          done
          custody
          test "$(wc -l < "$capture_dir/SHA256SUMS")" = 2
          test "$(wc -c < "$capture_dir/SHA256SUMS")" -le 160
          test "$(head -n 1 "$capture_dir/SHA256SUMS" | cut -c 65-)" = '  go.mod'
          test "$(tail -n 1 "$capture_dir/SHA256SUMS" | cut -c 65-)" = '  go.sum'
          test "$(grep -Ec '^[0-9a-f]{64}  go\.(mod|sum)$' "$capture_dir/SHA256SUMS")" = 2
          (cd "$capture_dir" && sha256sum --check --strict SHA256SUMS)
          grep -Fqx 'google.golang.org/grpc v1.83.2 h1:EManeRomTObA0BU7I8vXgg/78uE5MJ9M8B39EX2WscU=' "$capture_dir/go.sum"
          grep -Fqx 'google.golang.org/grpc v1.83.2/go.mod h1:YPI1hK3kDked6iHvgX3tR0y+nX/qpMFKhPgFsokw1S8=' "$capture_dir/go.sum"
          mod_sha="$(sha256sum "$capture_dir/go.mod" | cut -d' ' -f1)"
          sum_sha="$(sha256sum "$capture_dir/go.sum" | cut -d' ' -f1)"
          mod_size="$(wc -c < "$capture_dir/go.mod")"
          sum_size="$(wc -c < "$capture_dir/go.sum")"
          compiler_sha="$(git -C runtime-source rev-parse 'HEAD:${{ matrix.dockerfile }}')"
          jq -n --arg source "$SOURCE_SHA" --arg controller "$CONTROLLER_SHA" \
            --arg image "$image_id" --arg container "$container_id" --arg compiler "$compiler_sha" \
            --arg run "$GITHUB_RUN_ID" --arg variant "$VARIANT" --arg arch "$ARCH" \
            --arg mod "$mod_sha" --arg sum "$sum_sha" --argjson modSize "$mod_size" --argjson sumSize "$sum_size" \
            '{schema:"creator-signal.forgejo-dependency-capture/v1",sourceSha:$source,controllerSha:$controller,compilerImageId:$image,compilerDockerfileBlob:$compiler,containerId:$container,runId:$run,variant:$variant,architecture:$arch,module:"google.golang.org/grpc",version:"v1.83.2",files:{"go.mod":{sha256:$mod,size:$modSize},"go.sum":{sha256:$sum,size:$sumSize}},qualified:false}' \
            > "$capture_dir/receipt.json"
          test "$(wc -c < "$capture_dir/receipt.json")" -le 4096
          rm "$capture_dir/SHA256SUMS"
          test "$(git -C runtime-source rev-parse HEAD)" = "$SOURCE_SHA"
          git -C runtime-source diff --exit-code
          echo 'compilerNativeObservation=DependencyCaptureRetainedUnqualified'
          cmp runtime-source/go.mod "$capture_dir/go.mod"
          cmp runtime-source/go.sum "$capture_dir/go.sum"
          # Even identical output cannot qualify through this temporary capture route.
          exit 1
      - name: Run isolated native startup and readiness acceptance
        env:
          IMAGE: creator-signal-forgejo-qualification:${{ matrix.variant }}-${{ matrix.arch }}
          CONTAINER: forgejo-${{ matrix.variant }}-${{ matrix.arch }}-${{ github.run_id }}
          VERSION: ${{ inputs.release_version }}
        run: |
          cleanup() { docker logs "$CONTAINER" > "${CONTAINER}.log" 2>&1 || true; docker rm -f "$CONTAINER" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run --detach --name "$CONTAINER" --publish 127.0.0.1::3000 \
            --env FORGEJO__database__DB_TYPE=sqlite3 \
            --env FORGEJO__server__DISABLE_SSH=true \
            --env FORGEJO__security__INSTALL_LOCK=true \
            "$IMAGE"
          port="$(docker port "$CONTAINER" 3000/tcp | sed -n 's/.*://p')"
          test -n "$port"
          ready=false
          for _ in $(seq 1 90); do
            if curl --fail --silent --show-error "http://127.0.0.1:${port}/api/healthz" > health.json; then ready=true; break; fi
            sleep 2
          done
          test "$ready" = true
          jq -e '.status == "pass"' health.json
          curl --fail --silent --show-error "http://127.0.0.1:${port}/api/v1/version" > version.json
          jq -e --arg version "$VERSION" '.version | startswith($version + "+")' version.json
      - name: Exercise operation replay and tombstones through the actual native image API
        if: ${{ inputs.release_tag == 'v16.0.3-cs.2' }}
        env:
          IMAGE: creator-signal-forgejo-qualification:${{ matrix.variant }}-${{ matrix.arch }}
          SOURCE_SHA: ${{ inputs.source_ref }}
          CONTROLLER_SHA: ${{ github.workflow_sha }}
          VARIANT: ${{ matrix.variant }}
          ARCH: ${{ matrix.arch }}
        run: |
          test "$(git -C qualification-control rev-parse HEAD)" = "$CONTROLLER_SHA"
          image_id="$(docker image inspect "$IMAGE" --format '{{.Id}}')"
          python3 qualification-control/scripts/creator-signal/qualify_secret_pair.py \
            --image "$image_id" --source "$SOURCE_SHA" --run-id "$GITHUB_RUN_ID" \
            --variant "$VARIANT" --arch "$ARCH" > "secret-pair-${VARIANT}-${ARCH}.json"
      - name: Enforce fixed HIGH and CRITICAL vulnerability policy natively
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: creator-signal-forgejo-qualification:${{ matrix.variant }}-${{ matrix.arch }}
          version: v0.72.0
          format: json
          output: scan-${{ matrix.variant }}-${{ matrix.arch }}.json
          exit-code: "1"
          ignore-unfixed: true
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL,HIGH
      - name: Generate native platform SPDX SBOM
        uses: anchore/sbom-action@f8bdd1d8ac5e901a77a92f111440fdb1b593736b # v0.20.6
        with:
          image: creator-signal-forgejo-qualification:${{ matrix.variant }}-${{ matrix.arch }}
          format: spdx-json
          output-file: sbom-${{ matrix.variant }}-${{ matrix.arch }}.spdx.json
          upload-artifact: false
      - name: Generate source and native-build provenance
        env:
          IMAGE: creator-signal-forgejo-qualification:${{ matrix.variant }}-${{ matrix.arch }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_SHA: ${{ inputs.source_ref }}
          BASE_SOURCE_SHA: ${{ inputs.base_source_sha }}
          PATCH_SHA256: ${{ inputs.source_patch_sha256 }}
          PLATFORM: ${{ matrix.platform }}
          VARIANT: ${{ matrix.variant }}
          ARCH: ${{ matrix.arch }}
          RUNNER_NAME: ${{ runner.name }}
        run: |
          source_tree="$(git -C runtime-source rev-parse 'HEAD^{tree}')"
          image_id="$(docker image inspect "$IMAGE" --format '{{.Id}}')"
          jq -n \
            --arg tag "$RELEASE_TAG" --arg source "$SOURCE_SHA" --arg tree "$source_tree" \
            --arg base "$BASE_SOURCE_SHA" --arg patch "$PATCH_SHA256" --arg image "$image_id" \
            --arg platform "$PLATFORM" --arg variant "$VARIANT" --arg runner "$RUNNER_NAME" \
            '{schema:"creator-signal.forgejo-native-qualification-provenance/v1", releaseTag:$tag, sourceSha:$source, sourceTreeSha:$tree, upstreamBaseSha:$base, sourcePatchSha256:$patch, imageId:$image, platform:$platform, variant:$variant, nativeRunner:$runner}' \
            > "provenance-${VARIANT}-${ARCH}.json"
      - name: Preserve bounded native qualification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: forgejo-qualification-${{ matrix.variant }}-${{ matrix.arch }}-${{ github.run_id }}
          path: |
            health.json
            version.json
            creator-signal-source.patch
            secret-pair-${{ matrix.variant }}-${{ matrix.arch }}.json
            secret-pair-tests-${{ matrix.variant }}-${{ matrix.arch }}.log
            scan-${{ matrix.variant }}-${{ matrix.arch }}.json
            dependency-capture-${{ matrix.variant }}-${{ matrix.arch }}/go.mod
            dependency-capture-${{ matrix.variant }}-${{ matrix.arch }}/go.sum
            dependency-capture-${{ matrix.variant }}-${{ matrix.arch }}/receipt.json
            sbom-${{ matrix.variant }}-${{ matrix.arch }}.spdx.json
            provenance-${{ matrix.variant }}-${{ matrix.arch }}.json
            forgejo-${{ matrix.variant }}-${{ matrix.arch }}-${{ github.run_id }}.log
          if-no-files-found: warn
          retention-days: 14
