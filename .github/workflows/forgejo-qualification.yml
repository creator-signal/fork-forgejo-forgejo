name: Reusable Forgejo container qualification

on:
  workflow_call:
    inputs:
      source_ref:
        required: true
        type: string
      release_version:
        required: true
        type: string

permissions:
  contents: read

jobs:
  qualify:
    name: ${{ matrix.variant }} ${{ matrix.platform }} build, smoke, scan, SBOM
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: rootful
            dockerfile: Dockerfile
            platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - variant: rootless
            dockerfile: Dockerfile.rootless
            platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - variant: rootful
            dockerfile: Dockerfile
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
          - variant: rootless
            dockerfile: Dockerfile.rootless
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Check out exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - name: Verify exact source checkout
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$SOURCE_REF^{commit}")"
          git diff --exit-code
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build native candidate without publication
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          provenance: false
          sbom: false
          build-args: RELEASE_VERSION=${{ inputs.release_version }}
          tags: creator-signal-forgejo-qualification:${{ matrix.variant }}-${{ matrix.arch }}
          cache-from: type=gha,scope=forgejo-${{ matrix.variant }}-${{ matrix.arch }}
          cache-to: type=gha,mode=min,scope=forgejo-${{ matrix.variant }}-${{ matrix.arch }}
      - name: Run isolated native startup and readiness acceptance
        env:
          IMAGE: creator-signal-forgejo-qualification:${{ matrix.variant }}-${{ matrix.arch }}
          CONTAINER: forgejo-${{ matrix.variant }}-${{ matrix.arch }}-${{ github.run_id }}
          VERSION: ${{ inputs.release_version }}
        run: |
          cleanup() { docker logs "$CONTAINER" > "${CONTAINER}.log" 2>&1 || true; docker rm -f "$CONTAINER" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run --detach --name "$CONTAINER" --publish 127.0.0.1::3000 \
            --env FORGEJO__database__DB_TYPE=sqlite3 \
            --env FORGEJO__server__DISABLE_SSH=true \
            --env FORGEJO__security__INSTALL_LOCK=true \
            "$IMAGE"
          port="$(docker port "$CONTAINER" 3000/tcp | sed -n 's/.*://p')"
          test -n "$port"
          ready=false
          for _ in $(seq 1 90); do
            if curl --fail --silent --show-error "http://127.0.0.1:${port}/api/healthz" > health.json; then ready=true; break; fi
            sleep 2
          done
          test "$ready" = true
          grep -Eq '"status"[[:space:]]*:[[:space:]]*"pass"' health.json
          docker exec "$CONTAINER" forgejo --version | grep -F "Forgejo version $VERSION"
      - name: Enforce HIGH and CRITICAL vulnerability policy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: creator-signal-forgejo-qualification:${{ matrix.variant }}-${{ matrix.arch }}
          version: v0.72.0
          format: json
          output: scan-${{ matrix.variant }}-${{ matrix.arch }}.json
          exit-code: "1"
          ignore-unfixed: true
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL,HIGH
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@f8bdd1d8ac5e901a77a92f111440fdb1b593736b # v0.20.6
        with:
          image: creator-signal-forgejo-qualification:${{ matrix.variant }}-${{ matrix.arch }}
          format: spdx-json
          output-file: sbom-${{ matrix.variant }}-${{ matrix.arch }}.spdx.json
          upload-artifact: false
      - name: Preserve bounded qualification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: forgejo-qualification-${{ matrix.variant }}-${{ matrix.arch }}-${{ github.run_id }}
          path: |
            health.json
            scan-${{ matrix.variant }}-${{ matrix.arch }}.json
            sbom-${{ matrix.variant }}-${{ matrix.arch }}.spdx.json
            forgejo-${{ matrix.variant }}-${{ matrix.arch }}-${{ github.run_id }}.log
          if-no-files-found: warn
          retention-days: 14
